name: Release

# The tag is the only place the version is written. package.json's version
# field is overwritten from the tag below before publishing, so there is
# nothing to keep in sync and nothing to forget: a release is
# `git tag v0.3.0 && git push --tags`.
#
# Publishing authenticates with npm via OIDC trusted publishing — there is
# no npm token anywhere in this workflow or in repository secrets. npm
# verifies the OIDC claim against the trusted publisher configured for
# @licenselatte/latte on npmjs.com, which pins this repository AND this
# workflow's filename. Renaming this file breaks publishing until the npm
# side is updated to match.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # If the npm trusted publisher is configured with a GitHub environment,
    # it must be this one; if it is configured without an environment, this
    # still matches and additionally gives you the manual approval gate.
    environment: release
    permissions:
      contents: read
      # The OIDC token npm authenticates against. Without this the publish
      # fails with an authentication error rather than a permissions one,
      # which is a confusing way to discover it is missing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # testdata/ is the latte-testvectors submodule the fixture suite
          # runs against; without it the tests below cannot run at all.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Deliberately no `cache:` — npm's guidance is to never cache in a
          # release build, so a stale or poisoned cache entry cannot end up
          # inside a published tarball.

      # node-version "24" resolves to whatever 24.x the runner image has,
      # and early 24.x shipped npm 11.3, below the 11.5.1 OIDC floor. One
      # line to make the requirement explicit rather than depend on the
      # image; a too-old npm fails as an opaque auth error at the last step.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Writes the tag into package.json (and package-lock.json) in the
      # runner's working copy only — nothing is committed or pushed back.
      # --allow-same-version so a re-run of the same tag is not an error.
      - name: Set version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build
        run: npm run build

      # `files` is ["dist"], and dist/ is gitignored — so if the build
      # produced nothing, npm would happily publish an empty package. Fail
      # here instead, where it is obvious why.
      - name: Verify the build produced a package
        run: |
          test -f dist/index.js || { echo "dist/index.js missing — build produced nothing"; exit 1; }
          test -f dist/index.d.ts || { echo "dist/index.d.ts missing — no type declarations"; exit 1; }
          npm pack --dry-run

      # No token, and no --provenance flag: publishing through OIDC
      # generates and attaches the provenance attestation automatically.
      - name: Publish to npm
        run: npm publish
